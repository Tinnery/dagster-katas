[project]
name = "dagster-katas"
version = "0.1.0"
description = "Minimal, executable Dagster exercises. Learn one concept at a time, from first principles."
requires-python = ">=3.13,<3.14"
dependencies = [
    "dagster>=1.13.29",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
